# ============================================================
# 开发 / 局域网联调环境（NAS、本机、同局域网真机调试）
# 激活：默认即 dev（application.yml 中 spring.profiles.active=dev）
# ============================================================

spring:
  datasource:
    # 本地 MySQL；首次运行前先建库：
    #   CREATE DATABASE cathouse CHARACTER SET utf8mb4;
    url: jdbc:mysql://localhost:3306/cathouse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root

cathouse:
  # 管理员 openid 白名单（逗号分隔）。仅这些人能在「报销审核」中通过/驳回报销申请。
  # 留空则任何人无法审核（requireAdmin 会拒绝）。可用环境变量覆盖（生产环境不要写死个人 openid）。
  # 当前 dev 默认把本机登录账号（昵称 leshi）设为管理员，方便联调；上线前改为真实管理员 openid 或留空。
  admin:
    openids: ${CATHOUSE_ADMIN_OPENIDS:olPA13SI6J7Wq1rN55FJQzr6lqYA}
  file:
    # 返回给小程序的文件访问基址（上传后拿到的图片 URL 前缀）。
    # ⚠️ 这个地址是「小程序拿去访问图片」的地址，不是后端自己的地址，填错会导致图片全部打不开。
    #
    # 这里刻意留空 → 上传后返回「相对路径」/uploads/20260928/xxx.jpg：
    #   127.0.0.1 / 局域网 IP 都是会变的（换 WiFi、换机器、真机调试都会失效），
    #   而相对路径存进库里是环境无关的，前端 utils/api.js 会按当前环境
    #   （env.js 的 apiBaseUrl）自动补全成可访问的绝对地址。
    #   → 模拟器用 dev(127.0.0.1)、真机用 test(192.168.10.210) 都不用再改后端配置。
    #
    # 线上（prod 档）必须填「已备案域名 + HTTPS」的绝对地址，例如 https://cat.example.com。
    # 改本文件后需重启后端生效。
    base-url: ''
