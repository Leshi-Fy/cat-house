# ============================================================
# 线上环境（云服务器 + 已备案域名 + HTTPS）
# 激活：java -jar server.jar --spring.profiles.active=prod
#       或 ENV SPRING_PROFILES_ACTIVE=prod
# 敏感项（数据库密码、AppSecret）建议用环境变量注入，不要明文提交到仓库。
# ============================================================

spring:
  datasource:
    # 改为云服务器 MySQL 地址；useSSL=true 符合线上安全基线
    url: jdbc:mysql://${DB_HOST:localhost}:3306/cathouse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

cathouse:
  wechat:
    # ⚠️ 生产必须注入环境变量 CATHOUSE_WECHAT_SECRET（明文已从仓库移除）
    #    未注入时登录会直接报「未配置微信 AppID/Secret」，不会静默用错值
    secret: ${CATHOUSE_WECHAT_SECRET:YOUR_WECHAT_SECRET}
  auth:
    # ⚠️ 生产必须注入 CATHOUSE_AUTH_SECRET，否则用的默认密钥 = 任何人可伪造 token
    secret: ${CATHOUSE_AUTH_SECRET:cathouse-dev-secret-change-me}
  file:
    # 必须改成你的 https 域名（微信正式发布要求 HTTPS + 已备案域名）
    # 例如 base-url: https://cat.example.com
    base-url: https://your-domain.com
